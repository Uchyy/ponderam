<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Ponderam — think fast, play together. A multiplayer word game."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/ponderam-icon.png" />
    <link rel="apple-touch-icon" href="/assets/ponderam-icon.png" />

    <title>Ponderam — Think fast. Play together.</title>
  </head>
  <body>
    <div id="root"></div>
    <script  type="module" src="/src/main.jsx">
      (function (location) {
        if (location.search[1] === "/") {
          const decoded = location.search
            .slice(1)
            .split("&")
            .map((part) => part.replace(/~and~/g, "&"))
            .join("?");

          window.history.replaceState(
            null,
            null,
            location.pathname.replace(/\/$/, "") + decoded + location.hash
          );
        }
      })(window.location);
    </script>
  </body>
</html>
