
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ponderam</title>
    <script>
      const segmentCount = 1;

      const location = window.location;
      const pathSegments = location.pathname.split("/");

      const basePath = pathSegments
        .slice(0, 1 + segmentCount)
        .join("/");

      const routePath = pathSegments
        .slice(1 + segmentCount)
        .join("/");

      const redirectUrl =
        location.origin +
        basePath +
        "/?/" +
        routePath +
        location.search.replace(/&/g, "~and~") +
        location.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting to Ponderam…
  </body>
</html>
